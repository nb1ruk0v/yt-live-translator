transcription:
  model: "turbo"
  device: "cpu"          # cpu, cuda, mps
  language: "en"       # auto = detect, или "en", "ru", etc.

translation:
  model: "gemma4:e4b"
  ollama_url: "http://localhost:11434"

tts:
  model: "tts_models/multilingual/multi-dataset/xtts_v2"
  language: "ru"
  device: "cpu"          # cpu, cuda, mps
  reference_seconds: 10  # длина клипа референса для voice cloning

output:
  suffix: "_dubbed"
